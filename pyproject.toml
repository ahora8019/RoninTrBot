[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ronintrbot"
version = "1.0.0"
description = "Python-first Telegram trading assistant with staged safety controls"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot>=21,<23"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
