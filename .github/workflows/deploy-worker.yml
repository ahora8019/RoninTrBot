name: Deploy Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["workers/**", ".github/workflows/deploy-worker.yml"]

permissions:
  contents: read

jobs:
  secrets-present:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs: { ready: ${{ steps.check.outputs.ready }} }
    steps:
      - id: check
        env:
          CHECK_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHECK_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CHECK_API_TOKEN" ] || [ -z "$CHECK_ACCOUNT_ID" ]; then
            echo "BLOCKED: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not configured as GitHub Actions secrets." >&2
            echo "Deployment cannot proceed without real credentials; failing loudly instead of faking a deploy." >&2
            exit 1
          fi
          echo "ready=yes" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: secrets-present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Worker while preserving dashboard-managed role variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy --config workers/ronin-panel/wrangler.jsonc --keep-vars --var "GIT_SHA:$GITHUB_SHA"
          echo "Deployed git SHA: $GITHUB_SHA"
      - name: Install smoke-test dependencies from repository root
        run: python -m pip install -r requirements-lock.txt
      - name: Post-deploy health verification (smoke)
        run: python scripts/smoke_test.py --base-url https://ronintrbot.ahora-project.workers.dev

  rollback-note:
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Rollback pointer
        run: |
          echo "Deployment FAILED. Wrangler versions retain the previous deployment on Cloudflare;"
          echo "recover with: npx wrangler deployments list && npx wrangler rollback --config workers/ronin-panel/wrangler.jsonc"
          echo "See docs/deployment/rollback.md. Record the failing SHA: $GITHUB_SHA"
